<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Mart Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--bg:#F5F6F8;--card:#FFFFFF;--bd:#E4E6EA;--bd2:#EDEFF2;
--ink:#1C2126;--ink2:#5F6B76;--ink3:#8B949E;
--blue:#2490EF;--blueBg:#EAF4FE;--blueInk:#0C4272;--navy:#1B3A57;
--green:#22883E;--greenBg:#E8F5EC;--greenInk:#14532A;
--amber:#B8860B;--amberBg:#FDF4E0;--amberInk:#7A5800;
--orange:#C2591B;--orangeBg:#FCEEE4;--orangeInk:#8A3C10;
--red:#B4322C;--redBg:#FBEDEC;--redInk:#7C211D;
--grayBg:#F0F1F3;
--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
-webkit-font-smoothing:antialiased;font-size:13px}
button,input,select{font-family:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mono{font-family:var(--mono);font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}

/* ---- shell ---- */
.app{display:flex;flex-direction:column;height:100vh;min-height:560px}
.topbar{height:50px;flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--bd);
display:flex;align-items:center;gap:12px;padding:0 14px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 auto}
.brandname{font-size:13.5px;font-weight:600;white-space:nowrap}
.crumb{font-size:12px;color:var(--ink2);white-space:nowrap}
.sep{color:var(--ink3);font-size:12px}
.grow{flex:1 1 auto;min-width:0}

.statetoggle{display:flex;background:var(--grayBg);border-radius:8px;padding:3px;gap:2px;flex:0 0 auto}
.statetoggle button{border:none;background:transparent;border-radius:6px;padding:6px 13px;font-size:12px;
color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:500}
.statetoggle button[aria-pressed="true"]{background:var(--card);color:var(--ink);
box-shadow:0 1px 2px rgba(0,0,0,.07)}

.body{flex:1 1 auto;display:flex;min-height:0}
.side{width:206px;flex:0 0 auto;background:var(--card);border-right:1px solid var(--bd);
padding:13px 9px;overflow-y:auto}
.sideh{font-size:10px;font-weight:600;letter-spacing:.7px;color:var(--ink3);padding:0 10px 8px}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:7px;
border:1px solid transparent;background:transparent;font-size:13px;color:var(--ink2);cursor:pointer;
text-align:left;margin-bottom:2px}
.navbtn:hover{background:var(--bg)}
.navbtn[aria-current="page"]{background:var(--bg);border-color:var(--bd);color:var(--ink);font-weight:500}
.navbtn .cnt{margin-left:auto;font-size:10.5px;background:var(--orangeBg);color:var(--orangeInk);
padding:1px 7px;border-radius:9px;font-weight:600}
.fchk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);padding:4px 10px;cursor:pointer}
.fchk input{accent-color:var(--blue);width:14px;height:14px;margin:0;cursor:pointer}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.banner{flex:0 0 auto;padding:8px 22px;font-size:12px;display:flex;align-items:center;gap:9px;
border-bottom:1px solid var(--bd);line-height:1.45}
.banner.warn{background:var(--amberBg);color:var(--amberInk)}
.banner.ok{background:var(--greenBg);color:var(--greenInk)}
.content{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 22px 26px}

.phead{display:flex;align-items:flex-end;gap:14px;margin-bottom:13px;flex-wrap:wrap}
.h1{font-size:19px;font-weight:600;margin:0 0 3px}
.sub{font-size:12px;color:var(--ink3)}

.btn{height:30px;padding:0 11px;border:1px solid var(--bd);border-radius:7px;background:var(--card);
font-size:12px;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#CDD2D8;color:var(--ink)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:#14304a;color:#fff}
.btn[aria-pressed="true"]{background:var(--blueBg);border-color:#9FCBF5;color:var(--blueInk)}

.bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);
border-radius:9px;padding:9px 11px;margin-bottom:12px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--bd);
border-radius:7px;background:var(--bg);min-width:190px}
.search input{border:none;background:transparent;outline:none;font-size:12.5px;width:100%;color:var(--ink)}
.sel{height:30px;border:1px solid var(--bd);border-radius:7px;background:var(--card);font-size:12.5px;
color:var(--ink);padding:0 8px;cursor:pointer;outline:none}
.dt{width:106px;padding:0 9px;font-variant-numeric:tabular-nums}
.sel:focus-visible,.btn:focus-visible,.navbtn:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.cardh{font-size:12.5px;font-weight:600;margin-bottom:2px}
.cards{font-size:11px;color:var(--ink3);margin-bottom:11px}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;margin-bottom:13px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:11px;color:var(--ink2);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:25px;font-weight:600;line-height:1}
.kpi .n{font-size:10px;color:var(--ink3);margin-top:5px}

table{border-collapse:collapse;width:100%}
th{text-align:left;padding:8px 10px;font-size:9.5px;font-weight:600;letter-spacing:.35px;color:var(--ink3);
border-bottom:1px solid var(--bd);white-space:nowrap;background:var(--card);position:sticky;top:0;z-index:1}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--ink)}
td{padding:7px 10px;font-size:11.5px;border-bottom:1px solid var(--bd2);white-space:nowrap;
overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tw{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.tscroll{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 340px)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#FAFBFC}
tr.on td{background:var(--blueBg)}
.tfoot{padding:8px 12px;border-top:1px solid var(--bd);font-size:11px;color:var(--ink3);background:var(--bg);
display:flex;align-items:center;gap:12px}

.chip{display:inline-block;padding:2px 8px;border-radius:11px;font-size:10.5px;font-weight:500;white-space:nowrap}
.c-confirmed{background:var(--greenBg);color:var(--greenInk)}
.c-verified{background:var(--blueBg);color:var(--blueInk)}
.c-auto_confirmed{background:#E6F5F3;color:#10554C}
.c-offweb{background:#F3EDFB;color:#4B2B7F}
.c-probable{background:var(--amberBg);color:var(--amberInk)}
.c-pending{background:var(--orangeBg);color:var(--orangeInk)}
.c-not_linked{background:var(--grayBg);color:var(--ink2)}
.c-gray{background:var(--grayBg);color:var(--ink2)}
.c-red{background:var(--redBg);color:var(--redInk)}

.drawer{visibility:hidden;position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;background:var(--card);
border-left:1px solid var(--bd);box-shadow:-8px 0 26px rgba(20,30,40,.09);z-index:40;
display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease,visibility .2s}
.drawer.open{visibility:visible;transform:translateX(0)}
.drawerh{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.drawerb{flex:1 1 auto;overflow-y:auto;padding:14px 16px}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd2);font-size:11.5px}
.kv .k{width:118px;flex:0 0 auto;color:var(--ink3)}
.kv .v{flex:1 1 auto;min-width:0;word-break:break-word}
.tl{position:relative;padding-left:19px}
.tl:before{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:1px;background:var(--bd)}
.tli{position:relative;padding:0 0 13px}
.tli:before{content:"";position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;
background:var(--card);border:2px solid var(--blue)}
.tli.g:before{border-color:var(--green)}
.tli.n:before{border-color:var(--ink3)}

.pchip{border:none;padding:2px 8px;border-radius:11px;background:var(--grayBg);color:var(--ink2);
font-family:var(--mono);font-size:10px;cursor:pointer;max-width:100%;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle;line-height:17px}
.pchip:hover,.pchip:focus-visible{background:var(--blueBg);color:var(--blueInk);outline:none}
.pchip:focus-visible{box-shadow:0 0 0 2px var(--blue)}
.pop{position:fixed;z-index:70;pointer-events:none;width:400px;max-width:calc(100vw - 24px);background:var(--card);
border:1px solid var(--bd);border-radius:10px;box-shadow:0 10px 30px rgba(20,30,40,.16);
padding:12px 13px;display:none}
.pop.on{display:block}
.seg{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--grayBg);color:var(--ink);
font-size:11px;margin:0 2px 3px 0;word-break:break-all}
.popfull{pointer-events:auto;font-family:var(--mono);font-size:11px;color:var(--ink2);background:var(--bg);
border:1px solid var(--bd2);border-radius:7px;padding:8px 9px;word-break:break-all;
line-height:1.55;user-select:all;max-height:96px;overflow-y:auto}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--navy);
color:#fff;padding:10px 17px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;
transition:opacity .18s,transform .18s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.sgrid{display:grid;grid-template-columns:minmax(360px,1fr) minmax(300px,1fr) minmax(300px,1.1fr);gap:13px;align-items:start}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:11px}
.empty{display:flex;align-items:center;justify-content:center;min-height:420px;text-align:center}
.empty .inner{max-width:440px;padding:0 20px}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sgrid{grid-template-columns:minmax(0,1fr)}
  .tiers{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .side{display:none}
  .content{padding:14px}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .drawer{width:100%}
}
</style>
</head>

/* ---------- data access, decisions applied on top ---------- */
function statusOf(r){
  const k=r.rid&&r.ref?r.rid+'|'+r.ref:null;
  if(k&&S.decisions[k]) return S.decisions[k];
  return r.status;
}
/* a journey is dated by its first web touch; a quotation with no web session falls back to its quote date */
function jDate(r){return r.first?toISO(r.first):toISO(r.qdate);}
function journeys(nodate){
  return DATA[S.state].journeys.filter(r=>{
    if(r.brand && !onBrand(r.brand)) return false;
    if(!nodate && !inRange(jDate(r))) return false;
    return true;
  }).map(r=>Object.assign({},r,{status:statusOf(r)}));
}
function tracking(nodate){return DATA[S.state].tracking.filter(d=>onBrand(bof(d.ref_id))&&(nodate||inRange(toISO(d.session_date))));}
function quotations(nodate){
  const jm={};journeys(true).forEach(r=>{if(r.rid)jm[r.rid]=r;});
  return DATA[S.state].quotation.map((q,i)=>{
    const j=jm['R'+String(i).padStart(3,'0')];
    return Object.assign({},q,{match_status:j?j.status:q.match_status, ref_id:j?j.ref:q.ref_id});
  }).filter(q=>nodate||inRange(toISO(q['Quot. Date'])));
}
/* the review queue is a backlog, not a report: it ignores the period filter */
function queueCount(){return quotations(true).filter(x=>x.match_status==='pending'||x.match_status==='probable').length;}
function agg(){
  const j=journeys(), q=quotations();
  const t=j.filter(r=>r.ref).length;
  const mql=j.filter(r=>r.cta).length;
  const sql=q.length;
  const offweb=q.filter(x=>x.match_status==='offweb').length;
  const webSql=sql-offweb;                     /* mẫu số đúng của KPI: báo giá có gốc web */
  const linked=q.filter(x=>LINKED.indexOf(x.match_status)>=0).length;
  const queue=q.filter(x=>INQUEUE.indexOf(x.match_status)>=0).length;
  const granted=tracking().filter(d=>d.consent_action==='granted').length;
  return {t,mql,sql,offweb,webSql,linked,queue,granted,
          rate:webSql?Math.round(100*linked/webSql):0};
}

/* visited_pages arrives as several paths concatenated with no delimiter;
   cut before each /vi/ or /en/, then re-join a bare /vi or /en onto the next part */
function splitPages(v){
  if(!v||v==='---') return [];
  const raw=String(v).split(/(?=\/(?:vi|en)\/)/).filter(Boolean);
  const out=[];
  raw.forEach(p=>{ if(out.length&&(out[out.length-1]==='/vi'||out[out.length-1]==='/en')) out[out.length-1]+=p; else out.push(p); });
  return out;
}

function tintOf(v){const s2=normLabel(v).toLowerCase();let h=0;for(let i=0;i<s2.length;i++){h=(h*31+s2.charCodeAt(i))>>>0;}return TINTS[h%TINTS.length];}

function pageLabel(p){

function tCell(d,c){
  const v=d[c];
  if(c==='visited_pages') return pageChips(v,3,(d.ref_id||'')+'|'+(d.session_date||''));
  if(v==null||v===''||v==='---') return dash;
  if(c==='consent_action') return v==='granted'?chip('granted','confirmed'):chip('denied','gray');
  if(c==='ref_id'||c==='consent_id') return mono(v);
  if(c==='returning') return '<span style="color:var(--green);font-weight:600">&#10003;</span>';
  if(c==='consent_date'||c==='session_date'||c==='total_time'||c==='time_to_action')
    return '<span class="muted">'+esc(v)+'</span>';
  return esc(v);
}

 ['KHÁCH (lead)',[['ref_id',168],['consent_id',96],['consent_action',96],['consent_date',118],['country',64],['user_email',176],['user_name',114]]],
 ['SESSION',[['session',66],['session_date',118],['starting_page',178],['utm_source',96],['utm_medium',100],['utm_campaign',146],['utm_term',90],['utm_content',98],['visited_pages',300]]],
 ['CTA CLICK',[['cta_channel',106],['action_page',178],['time_to_action',106]]]];

function sessKey(d){
  const m=/(\d{2}):(\d{2})\s+(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(d.session_date||''));
  return m?Date.UTC(+m[5],+m[4]-1,+m[3],+m[1],+m[2]):0;
}
function pivotRows(rows){
  const by={},order=[];
  rows.forEach(d=>{if(!by[d.ref_id]){by[d.ref_id]=[];order.push(d.ref_id);}by[d.ref_id].push(d);});
  const out=[];
  order.forEach(ref=>{
    const s=by[ref].slice().sort((a,b)=>sessKey(a)-sessKey(b));
    s.forEach((d,i)=>out.push({d:d,first:i===0,n:i+1,last:i===s.length-1}));
  });
  return out;
}

/* chẩn đoán: vì sao Điều kiện 3 không sinh ra ứng viên nào */
function cond3Diag(){
  const all=journeys(true).filter(r=>r.client&&r.cond===3);
  if(!all.length) return '';
  const dead=all.filter(r=>!r.score||r.score===0);
  if(!dead.length) return '';
  const ns=dead.map(r=>r.c_n||0).filter(x=>x);
  const avg=ns.length?Math.round(ns.reduce((a,b)=>a+b,0)/ns.length):0;
  return '<div class="bar" style="background:var(--amberBg);border-color:#E8C87A;align-items:flex-start">'+
   '<span style="font-size:11.5px;color:var(--amberInk);line-height:1.6">'+
   '<strong>Điều kiện 3 không đề xuất được cặp nào trong kỳ này.</strong> '+
   dead.length+' báo giá chạy qua Điều kiện 3, mỗi lần lọc ra trung bình '+avg+' ứng viên trong cửa sổ 15 ngày. '+
   'Trên 8 ứng viên thì hệ số duy nhất bằng 0, nên điểm luôn bằng 0. '+
   'Đây là hành vi đúng theo quy tắc — chỉ có ngày báo giá thì không đủ thông tin để nhận diện một người.</span></div>';
}

function vDQ(){
  const tr=tracking(true),q=quotations(true),tobe=S.state==='tobe';
  const dupeRef=(()=>{const c={};tr.forEach(d=>c[d.ref_id]=(c[d.ref_id]||0)+1);return Object.keys(c).filter(k=>c[k]>1);})();
  const dupeQ=(()=>{const c={};q.forEach(x=>c[x['Quotation ID']]=(c[x['Quotation ID']]||0)+1);return Object.keys(c).filter(k=>c[k]>1);})();
  const dupe=dupeQ.length;
  const dupLabels=[];
  ['Client Source','Consultant','Market','Upsell'].forEach(f=>{
    const seen={};
    q.forEach(x=>{const raw=String(x[f]||'');if(!raw)return;const k=normLabel(raw).toLowerCase();
      (seen[k]=seen[k]||{})[raw]=1;});
    Object.keys(seen).forEach(k=>{const forms=Object.keys(seen[k]);
      if(forms.length>1) dupLabels.push({field:f,label:normLabel(forms[0])});});
  });
  const badRef=tr.filter(d=>!/^web(glac|gla|exh)-\d{6}-\d+$/.test(d.ref_id)).length;
  const badCid=q.filter(x=>!/^G\d{4}-\d{4}$/.test(x['Client ID'])).length;
  const rules=[
   ['DQ-01','Completeness','Row count in the Data Mart equals the source','100%',tr.length+' / '+tr.length+' sessions · '+q.length+' / '+q.length+' quotations','ok'],
   ['DQ-02','Uniqueness','No duplicate primary key','0 duplicates',
     dupe===0?'All identifiers unique':'<strong>'+dupeQ.length+' Quotation ID reused across '+q.filter(x=>dupeQ.indexOf(x['Quotation ID'])>=0).length+' rows</strong> — '+dupeQ.map(k=>'<span class="mono">'+k+'</span>').join(', ')+'. Loaded with a warning flag, never silently merged.',
     dupe===0?'ok':'bad'],
   ['DQ-03','Accuracy','No two Client IDs merged without a warning flag','0',tobe?'2 conflicts flagged, both in the review queue':'Not applicable — nothing is merged yet',tobe?'ok':'na'],
   ['DQ-04','Validity','REF ID and Client ID match their formats','≥ 99%',(badRef+badCid)===0?'All identifiers well-formed':(badRef+badCid)+' malformed',(badRef+badCid)===0?'ok':'bad'],
   ['DQ-05','Timeliness','Lag between source and Data Mart','≤ 2 h','Last sync 18/09/2026 14:50 · 12 min ago','ok'],
   ['DQ-06','Consistency','Dashboard totals equal the detail tables','100%','Funnel, brand split and source split all reconcile','ok'],
   ['DQ-07','Standardisation','Each category label appears in exactly one written form','0 variants',
     dupLabels.length===0?'All category labels are canonical'
     :'<strong>'+dupLabels.length+' label'+(dupLabels.length>1?'s':'')+' written two ways</strong> — '+
      dupLabels.map(d=>'<span class="mono">'+esc(d.field)+'</span>: “'+esc(d.label)+'” stored as NFC and as NFD, so a grouping splits it in two').join('; ')+
      '. Normalised on load; the source tool should enforce one form.',
     dupLabels.length===0?'ok':'bad']];
  const badge=s=>s==='ok'?chip('Pass','confirmed'):s==='bad'?chip('Fail','not_linked'):chip('n/a','gray');
  const rowsH=rules.map(r=>'<tr><td>'+mono(r[0])+'</td><td style="font-weight:500">'+r[1]+'</td>'+
    '<td style="white-space:normal">'+r[2]+'</td><td class="muted">'+r[3]+'</td>'+
    '<td style="white-space:normal">'+r[4]+'</td><td>'+badge(r[5])+'</td></tr>').join('');
  const consent=tr.filter(d=>d.consent_action==='granted').length;
  return phead('Data Quality','Reconciliation against the whole store, not the selected period · DAMA dimensions')+
   '<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+
   kpi('Rules passing',rules.filter(r=>r[5]==='ok').length+' / '+rules.length,'Checked at every sync')+
   kpi('Consent granted',consent+' / '+tr.length,'Denied sessions keep only the REF ID')+
   kpi('Fields never loaded','16','Client financials, e-mail routing, system keys')+'</div>'+
   '<div class="tw"><div class="tscroll"><table style="min-width:900px"><thead><tr>'+
   ['Rule','Dimension','Check','Threshold','Result','Status'].map(h=>'<th>'+h.toUpperCase()+'</th>').join('')+
   '</tr></thead><tbody>'+rowsH+'</tbody></table></div>'+
   '<div class="tfoot"><span>Consent denied on '+(tr.length-consent)+' sessions. Those rows carry a REF ID and a timestamp only, and are excluded from every rate on the dashboard.</span></div></div>';
}

  return phead('Hướng dẫn sử dụng','Sáu bước để dùng GLAC Data Mart · bản demo dùng dữ liệu mẫu')+
   '<div class="card" style="margin-bottom:13px">'+
   '<div style="font-size:13px;font-weight:600;margin-bottom:7px">Data Mart này giải quyết việc gì</div>'+

   '<ul style="margin:0;padding-left:18px;font-size:11.5px;line-height:1.8;color:var(--amberInk)">'+

}

/* ---------- drawer ---------- */
function openDrawer(id){
  const r=journeys().find(x=>x.ref+'|'+x.rid===id);
  const d=$('#drawer');
  if(!r){d.classList.remove('open');d.setAttribute('aria-hidden','true');return;}
  S.sel=id;
  const kv=(k,v)=>'<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';
  const tl=r.sesslist.length
    ? '<div class="tl">'+r.sesslist.map((s,i)=>'<div class="tli'+(i===0?' g':'')+'">'+
        '<div style="font-size:11.5px;font-weight:500;margin-bottom:2px">Session '+(i+1)+' <span class="muted" style="font-weight:400">'+esc(s.t)+'</span></div>'+
        '<div style="font-size:11px;color:var(--ink2);word-break:break-all">'+(s.p?esc(s.p):'<span class="muted">page not recorded (consent denied)</span>')+'</div>'+
        (s.d?'<div style="font-size:10.5px" class="muted">'+esc(s.d)+' on site</div>':'')+'</div>').join('')+
      (r.cta?'<div class="tli g"><div style="font-size:11.5px;font-weight:500;margin-bottom:2px">MQL · '+esc(r.cta)+'</div>'+
        '<div style="font-size:11px;color:var(--ink2)">'+esc(r.mqlts)+(r.ctat?' · after '+esc(r.ctat):'')+'</div></div>':'')+
      (r.qdate?'<div class="tli"><div style="font-size:11.5px;font-weight:500;margin-bottom:2px">SQL · '+esc(r.svc)+'</div>'+
        '<div style="font-size:11px;color:var(--ink2)">'+esc(r.qdate)+' · '+esc(r.quot)+'</div></div>':'')+
      '</div>'
    : '<div class="muted" style="font-size:11.5px;padding:8px 0">This quotation has no web sessions attached.</div>';
  d.innerHTML='<div class="drawerh"><div class="grow"><div style="font-size:13.5px;font-weight:600">'+
    (r.ref?esc(r.ref):esc(r.client))+'</div><div class="muted" style="font-size:11px;margin-top:2px">'+
    esc(r.stage)+' · '+esc(LBL[r.status])+'</div></div>'+
    '<button class="btn" data-act="close" aria-label="Close panel">✕</button></div>'+
    '<div class="drawerb">'+
    '<div style="font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--ink3);margin-bottom:8px">JOURNEY</div>'+tl+
    '<div style="font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--ink3);margin:18px 0 6px">WEB TRACKING</div>'+
    kv('Brand',val(r.brand))+kv('Consent',val(r.consent))+kv('Country',val(r.country))+
    kv('Sessions',r.sessions||dash)+kv('Time on site',r.secs?r.secs+' s':dash)+
    kv('Returning',r.ret?'yes':'no')+
    kv('Landing page',r.land?'<span style="word-break:break-all">'+esc(r.land)+'</span>':dash)+
    kv('utm_source',val(r.src))+kv('utm_medium',val(r.med))+kv('utm_campaign',val(r.camp))+
    kv('E-mail on web',val(r.email))+
    '<div style="font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--ink3);margin:18px 0 6px">QUOTATION</div>'+
    kv('Client ID',r.client?mono(r.client):dash)+kv('Quotation ID',r.quot?mono(r.quot):dash)+
    kv('Consultant',val(r.cons))+kv('Client source',val(r.csrc))+kv('Service',val(r.svc))+
    kv('Market',val(r.market))+kv('Upsell',val(r.ups))+kv('Value band',val(r.band))+
    kv('Client e-mail',r.cemail?maskMail(r.cemail):dash)+
    '<div style="font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--ink3);margin:18px 0 6px">MATCH</div>'+
    kv('Confidence',chip(LBL[r.status],r.status))+kv('Score',r.score?r.score:dash)+
    kv('Method',val(r.method))+kv('Time to SQL',(r.tts!==''&&r.tts!=null)?r.tts+' days':dash)+
    kv('Source check',agreeCell(r))+
    '</div>';
  d.classList.add('open');d.setAttribute('aria-hidden','false');
}
function closeDrawer(){S.sel=null;const d=$('#drawer');d.classList.remove('open');d.setAttribute('aria-hidden','true');render();}

/* ---------- shell + events ---------- */
function render(){
  const a=agg(),qc=queueCount(),tobe=S.state==='tobe';
  const views={guide:vGuide,dash:vDash,unified:vUnified,track:vTrack,quote:vQuote,review:vReview,dq:vDQ};
  const label={guide:'Hướng dẫn sử dụng',dash:'Dashboard',unified:'Unified Journey',track:'Web Tracking',quote:'Quotation',review:'Review Queue',dq:'Data Quality'};
  const nav=NAV.map(n=>'<button class="navbtn" data-act="nav" data-v="'+n[0]+'"'+(S.view===n[0]?' aria-current="page"':'')+'>'+
    '<span>'+n[1]+'</span>'+(n[0]==='review'&&qc?'<span class="cnt num">'+qc+'</span>':'')+'</button>').join('');
  const brands=['GLAC','GLA','ExportHelp'].map(b=>'<label class="fchk"><input type="checkbox" data-act="brand" data-v="'+b+'"'+
    (S.brands[b]?' checked':'')+'>'+b+'</label>').join('');
  const banner='<div class="banner ok"><strong>Bản mô phỏng giao diện</strong> — trạng thái sau khi Quotation Tool ghi REF ID, thời điểm và kênh liên hệ. '+
    'Match rate '+a.rate+'% trên '+a.webSql+' báo giá có gốc web. Dữ liệu mẫu, email đã được mã hoá.</div>';
  $('#app').innerHTML=
   '<div class="topbar"><div class="logo">G</div><span class="brandname">GLAC Data Mart</span>'+
   '<span class="sep">/</span><span class="crumb">'+label[S.view]+'</span><div class="grow"></div>'+
   '<span class="chip c-confirmed" style="font-size:11px">After implementation</span></div>'+
   '<div class="body"><nav class="side" aria-label="Module sections"><div class="sideh">MARCOM WORKSPACE</div>'+nav+
   '<div class="sideh" style="margin-top:18px">BRAND</div>'+brands+
   '<div class="sideh" style="margin-top:18px">PERIOD</div>'+
   '<div style="padding:0 10px;font-size:12px;color:var(--ink2);line-height:1.5">'+esc(rangeLabel())+'</div>'+
   '</nav><main class="main">'+banner+'<div class="content">'+views[S.view]()+'</div></main></div>';
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==='nav'){S.view=v;S.q='';S.sort={key:'',dir:1};S.conf='all';S.stage='all';S.consent='all';S.svc='all';S.colPanel=false;S.rules=false;closeDrawer();return;}
  if(a==='brand'){S.brands[v]=t.checked?1:0;render();return;}
  if(a==='col'){if(t.checked)delete S.hidden[v];else S.hidden[v]=1;render();return;}
  if(a==='conf'){S.conf=v;render();return;}
  if(a==='sort'){const k=t.dataset.k;S.sort=(S.sort.key===k)?{key:k,dir:-S.sort.dir}:{key:k,dir:1};render();return;}
  if(a==='row'){const id=t.dataset.id;if(S.sel===id){closeDrawer();}else{openDrawer(id);render();openDrawer(id);}return;}
  if(a==='cand'){S.sel=t.dataset.id;render();return;}
  if(a==='close'){closeDrawer();return;}
  if(a==='pgcopy'){copyText(t.dataset.p);return;}
  if(a==='dclear'){S.range='all';S.from='';S.to='';S.dateErr='';render();return;}
  if(a==='pgmore'){const k=t.dataset.k;if(S.pexp[k])delete S.pexp[k];else S.pexp[k]=1;hidePopNow();render();return;}
  if(a==='cols'){
    if(S.view==='quote'){toast('Column chooser: 12 of 31 source fields are loaded into this module. The other 19 are never read from Quotation Tool.');return;}
    S.colPanel=!S.colPanel;render();return;}
  if(a==='tview'){S.trackView=v;render();return;}
  if(a==='tounified'){S.view='unified';S.conf=v;S.stage='all';S.q='';S.colPanel=false;render();return;}
  if(a==='colsall'){S.hidden={};render();return;}
  if(a==='colsnone'){S.hidden={};colsFor().forEach(c=>{if(['ref_id','consent_action','session_date','session'].indexOf(c[0])<0)S.hidden[c[0]]=1;});render();return;}
  if(a==='export'){toast('Export queued — '+t.dataset.what+', current filters, UTF-8 CSV. Logged for audit.');return;}
  if(a==='rules'){S.rules=!S.rules;render();return;}
  if(a==='resetq'){S.decisions={};toast('Review queue restored to the sample values');render();return;}
  if(a==='decide'){
    const id=t.dataset.id,r=journeys().find(x=>x.ref+'|'+x.rid===id);
    S.decisions[r.rid+'|'+r.ref]=v;
    const rest=candidates();
    S.sel=rest.length?rest[0].ref+'|'+rest[0].rid:null;
    toast(v==='verified'?'Link confirmed — '+r.client+' ↔ '+r.ref:'Pair rejected — it will not be suggested again');
    render();return;}
});
document.addEventListener('input',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='q'){S.q=t.value;const p=t.selectionStart;render();
    const n=$('#'+t.id);if(n){n.focus();try{n.setSelectionRange(p,p);}catch(_){}}}
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='stage'){S.stage=t.value;render();}
  if(a==='consent'){S.consent=t.value;render();}
  if(a==='svc'){S.svc=t.value;render();}
  if(a==='role'){S.role=t.value;render();}
  if(a==='range'){S.range=t.value;S.dateErr='';
    if(PRESETS[t.value]){S.from=PRESETS[t.value][0];S.to=PRESETS[t.value][1];}
    render();}
  if(a==='dfrom'||a==='dto'){
    const key=(a==='dfrom')?'from':'to', raw=t.value.trim();
    if(raw===''){S[key]='';S.dateErr='';S.range=(S.from||S.to)?'custom':'all';render();return;}
    const iso=parseDMY(raw);
    if(!iso){S.dateErr=a;render();return;}
    S[key]=iso;S.dateErr='';S.range='custom';
    if(S.from&&S.to&&S.from>S.to){const x=S.from;S.from=S.to;S.to=x;}
    render();}
});
document.addEventListener('mouseover',e=>{
  const b=e.target.closest('[data-act="pgcopy"]');
  if(b) showPop(b);
});
document.addEventListener('mouseout',e=>{
  if(e.target.closest('[data-act="pgcopy"]')) hidePop();
});
document.addEventListener('focusin',e=>{
  const b=e.target.closest('[data-act="pgcopy"]');
  if(b) showPop(b); else hidePopNow();
});
document.addEventListener('scroll',hidePopNow,true);
window.addEventListener('resize',hidePopNow);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hidePopNow();closeDrawer();}});
render();
</script>
